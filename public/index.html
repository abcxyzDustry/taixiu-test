<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVIP.FUN - Game Đổi Thưởng Số 1 VN</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .subtitle {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .game-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .game-card:hover::before {
            left: 100%;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.2);
        }
        .game-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        .game-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .game-desc {
            font-size: 0.8em;
            opacity: 0.8;
        }
        .status-panel {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border-left: 4px solid #4CAF50;
        }
        .status-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
            font-size: 0.95em;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .feature-badge {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>RVIP.FUN</h1>
        <p class="subtitle">Game Đổi Thưởng Số 1 Việt Nam</p>
        
        <div class="games-grid">
            <div class="game-card" onclick="launchGame('taixiu')">
                <span class="game-icon">🎲</span>
                <div class="game-name">TÀI XỈU</div>
                <div class="game-desc">Dự đoán Tài/Xỉu</div>
                <div class="feature-badge">HOT</div>
            </div>
            
            <div class="game-card" onclick="launchGame('baucua')">
                <span class="game-icon">🦀</span>
                <div class="game-name">BẦU CUA</div>
                <div class="game-desc">6 mặt đỏ đen</div>
                <div class="feature-badge">TRENDING</div>
            </div>
            
            <div class="game-card" onclick="launchGame('poker')">
                <span class="game-icon">♠️</span>
                <div class="game-name">MINI POKER</div>
                <div class="game-desc">3 cây đầy kịch tính</div>
            </div>
            
            <div class="game-card" onclick="launchGame('banca')">
                <span class="game-icon">🎯</span>
                <div class="game-name">BẮN CÁ</div>
                <div class="game-desc">Rinh quà khủng</div>
            </div>
        </div>

        <div class="status-panel">
            <div class="status-item">
                <span class="online-dot"></span>
                <span>✅ Server: Đang hoạt động</span>
            </div>
            <div class="status-item">
                <span class="online-dot"></span>
                <span>📱 Tương thích: Mobile & Desktop</span>
            </div>
            <div class="status-item">
                <span class="online-dot"></span>
                <span>🚀 Backend: Tài Xỉu & Bầu Cua Ready</span>
            </div>
            <div class="status-item" id="websocket-status">
                <span class="online-dot"></span>
                <span>🔌 WebSocket: Đang kết nối...</span>
            </div>
        </div>
    </div>

    <script>
        function launchGame(gameType) {
            const games = {
                'taixiu': { name: 'TÀI XỈU', ready: true },
                'baucua': { name: 'BẦU CUA', ready: true },
                'poker': { name: 'MINI POKER', ready: false },
                'banca': { name: 'BẮN CÁ', ready: false }
            };
            
            const game = games[gameType];
            
            if (game.ready) {
                const message = `🎮 KHỞI CHẠY ${game.name}\n\n` +
                              `✅ Backend server: Đã sẵn sàng\n` +
                              `🔌 WebSocket: Kết nối real-time\n` +
                              `🎲 Game loop: Đang chạy tự động\n` +
                              `📊 Database: Đã kết nối\n\n` +
                              `Game sẽ load trong giây lát...`;
                alert(message);
                
                // Trong thực tế sẽ chuyển hướng đến game
                console.log(`Launching game: ${gameType}`);
            } else {
                alert(`🛠 ${game.name} đang được phát triển\n\n` +
                      `Vui lòng quay lại sau để trải nghiệm!`);
            }
        }

        // WebSocket connection for real-time features
        try {
            const socket = new WebSocket('wss://one11bet-com.onrender.com/client');
            
            socket.onopen = function() {
                console.log('✅ Connected to game server');
                document.getElementById('websocket-status').innerHTML = 
                    '<span class="online-dot"></span><span>🔌 WebSocket: Đã kết nối real-time</span>';
            };
            
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log('📨 Game data received:', data);
                // Xử lý dữ liệu game real-time ở đây
            };
            
            socket.onclose = function() {
                document.getElementById('websocket-status').innerHTML = 
                    '<span style="background: #ff4444;" class="online-dot"></span><span>🔌 WebSocket: Mất kết nối</span>';
            };
            
        } catch (error) {
            console.log('WebSocket error:', error);
        }

        console.log('🎮 RVIP.FUN - Game interface loaded successfully!');
    </script>
</body>
</html>
