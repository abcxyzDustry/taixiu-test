<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVIP.FUN - Game Đổi Thưởng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .games {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .game-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid white;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .game-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 RVIP.FUN</h1>
        <p>Game Đổi Thưởng Số 1 Việt Nam</p>
        
        <div class="games">
            <button class="game-btn" onclick="playGame('taixiu')">🎲 Tài Xỉu</button>
            <button class="game-btn" onclick="playGame('baucua')">🦀 Bầu Cua</button>
            <button class="game-btn" onclick="playGame('poker')">♠️ Mini Poker</button>
            <button class="game-btn" onclick="playGame('banca')">🎯 Bắn Cá</button>
        </div>
        
        <div class="status">
            <p>✅ Server: Đang hoạt động</p>
            <p>📱 Tương thích mọi thiết bị</p>
            <p>🚀 Game backend ready</p>
        </div>
    </div>

    <script>
        function playGame(game) {
            if (game === 'taixiu' || game === 'baucua') {
                alert('🎮 Game ' + game.toUpperCase() + ' đang khởi chạy...\n\nBackend server đã sẵn sàng!\nWebSocket: Kết nối thành công');
            } else {
                alert('🛠 Game đang được phát triển\nVui lòng quay lại sau!');
            }
        }

        // WebSocket test
        try {
            const ws = new WebSocket('wss://one11bet-com.onrender.com/client');
            ws.onopen = function() {
                console.log('✅ WebSocket connected to game server');
                document.querySelector('.status').innerHTML += '<p>🔌 WebSocket: Đã kết nối</p>';
            };
            ws.onmessage = function(event) {
                console.log('Game data:', event.data);
            };
        } catch (e) {
            console.log('WebSocket connection failed:', e.message);
        }

        console.log('🎮 RVIP.FUN Game loaded successfully!');
    </script>
</body>
</html>
