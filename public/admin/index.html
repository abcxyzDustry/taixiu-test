<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Game</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="style-desktop.css" media="screen and (min-width: 800px)">
    <link rel="stylesheet" href="style-mobile.css" media="screen and (max-width: 800px)">
    
    <!-- FIX: Load game-fix.js trước main.js -->
    <script src="game-fix.js"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none;">
        <div class="progress-bar" style="position: absolute; top: 50%; left: 10%; width: 80%; height: 20px; background: #333; border-radius: 10px;">
            <span style="display: block; height: 100%; background: #4CAF50; border-radius: 10px; width: 0%; transition: width 0.3s;"></span>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="GameCanvas" width="960" height="640" style="visibility: hidden;"></canvas>
    
    <!-- Scripts -->
    <script src="cocos2d-js-min.js"></script>
    <script src="main.js"></script>

    <!-- Admin Panel (nếu cần) -->
    <script>
        // Admin WebSocket fix
        if (window.location.pathname.includes('/admin/')) {
            console.log('🔧 Loading Admin Panel WebSocket Fix...');
            try {
                const adminSocket = new WebSocket('ws://127.0.0.1/redtcp');
                adminSocket.onopen = function() {
                    console.log('✅ Admin Panel WebSocket connected');
                };
                adminSocket.onerror = function(error) {
                    console.log('❌ Admin WebSocket error:', error);
                };
            } catch (error) {
                console.log('❌ Admin WebSocket failed:', error);
            }
        }
    </script>
</body>
</html>
