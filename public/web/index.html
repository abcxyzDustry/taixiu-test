  <!-- 🚀 SOCKET.IO CLIENT & CONNECTION FIX -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
// 🎮 Socket.IO Connection Fix for Tai Xiu Game
console.log('🔧 Loading Socket.IO connection fix...');

const SOCKET_SERVER_URL = 'https://one11bet-websocket.onrender.com';

// Global Socket.IO instance for the game
window.gameSocket = io(SOCKET_SERVER_URL, {
  transports: ['websocket', 'polling'],
  reconnection: true,
  reconnectionAttempts: 5,
  reconnectionDelay: 1000
});

// Socket event handlers
window.gameSocket.on('connect', () => {
  console.log('✅ Connected to Socket.IO server:', SOCKET_SERVER_URL);
  console.log('🎮 Socket ID:', window.gameSocket.id);
});

window.gameSocket.on('welcome', (data) => {
  console.log('🎯 Server welcome:', data);
});

window.gameSocket.on('disconnect', (reason) => {
  console.log('❌ Disconnected from server:', reason);
});

window.gameSocket.on('connect_error', (error) => {
  console.log('❌ Connection error:', error);
});

// Override the game's WebSocket connection to use our Socket.IO
const originalWebSocket = window.WebSocket;
window.WebSocket = function(url, protocols) {
  console.log('🎯 Game attempted WebSocket to:', url);
  
  if (url && url.includes('127.0.0.1')) {
    console.log('🔄 Blocking localhost WebSocket, using Socket.IO instead');
    
    // Return a mock WebSocket that uses our Socket.IO
    return {
      readyState: 1, // OPEN - fake successful connection
      send: function(data) {
        console.log('📤 Intercepted WebSocket send:', data);
        try {
          const parsed = JSON.parse(data);
          // Route to appropriate Socket.IO event
          if (parsed.type === 'chat') {
            window.gameSocket.emit('chat_message', parsed);
          } else if (parsed.type === 'game_event') {
            window.gameSocket.emit('game_event', parsed);
          } else {
            window.gameSocket.emit('game_data', parsed);
          }
        } catch (e) {
          window.gameSocket.emit('raw_data', data);
        }
      },
      close: function() {
        console.log('🔒 Mock WebSocket closed');
      },
      addEventListener: function(event, callback) {
        console.log('🎧 Mock WebSocket listening for:', event);
        
        if (event === 'open') {
          // Simulate immediate connection success
          setTimeout(() => callback(new Event('open')), 100);
        } else if (event === 'message') {
          // Handle incoming Socket.IO messages
          window.gameSocket.on('game_update', (data) => {
            const messageEvent = new MessageEvent('message', {
              data: JSON.stringify(data)
            });
            callback(messageEvent);
          });
        }
      },
      removeEventListener: function() {
        console.log('🔕 Mock WebSocket removeEventListener');
      }
    };
  }
  
  // Allow non-localhost WebSockets
  return new originalWebSocket(url, protocols);
};

// Copy WebSocket static properties
window.WebSocket.CONNECTING = originalWebSocket.CONNECTING;
window.WebSocket.OPEN = originalWebSocket.OPEN;
window.WebSocket.CLOSING = originalWebSocket.CLOSING;
window.WebSocket.CLOSED = originalWebSocket.CLOSED;

console.log('✅ Socket.IO connection fix loaded!');
console.log('🎮 Game will use Socket.IO server:', SOCKET_SERVER_URL);

// Global game socket helper
window.connectToGameServer = function() {
  return window.gameSocket;
};
  </script>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script src="src/settings.js" charset="utf-8"></script>

<script src="main.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
</body>
